<!DOCTYPE html>
<html>
<head>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; }
  model-viewer {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
</style>
</head>
<body>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<model-viewer
  src="5_7_2026-1.glb"
  camera-controls
  shadow-intensity="1"
  camera-orbit="180deg 90deg 90%"
  camera-target="0m 0m 0m"
  interaction-prompt="none"
  disable-pan>
</model-viewer>
</body>
</html>
